<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento | Curso ECOEMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
    <style>
        :root {
            --bg-color: #080a14;
            --text-color: #ffffff;
            --glass-bg: rgba(25, 25, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --neon-purple: #c65dfd;
            --neon-pink: #ff5ea1;
            --neon-blue: #5ce1e6;
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, rgba(25, 25, 40, 1) 0%, rgba(8, 10, 20, 1) 100%);
            font-family: 'Poppins', sans-serif; color: var(--text-color);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        .stars { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite ease-in-out alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* --- LUNA --- */
        .moon {
            position: absolute; top: 10%; right: 10%; width: 120px; height: 120px;
            background: radial-gradient(circle at 30% 30%, #e2e8f0, #94a3b8);
            border-radius: 50%;
            box-shadow: inset -20px -20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(255,255,255,0.2);
            z-index: 5;
        }
        .crater { position: absolute; background: rgba(0,0,0,0.1); border-radius: 50%; box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3); }

        /* --- TARJETA --- */
        .maintenance-card {
            background: var(--glass-bg); backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border); padding: 4rem 2.5rem;
            border-radius: 35px; text-align: center; max-width: 550px; width: 85%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(198, 93, 253, 0.2);
            position: relative; z-index: 10;
        }

        /* --- COHETE --- */
        .rocket-container {
            position: absolute; z-index: 20; top: 0; left: 0;
            transform: translate(-100px, 110vh) rotate(45deg);
            filter: drop-shadow(0 0 15px var(--neon-pink));
        }
        .rocket-body { font-size: 5rem; position: relative; z-index: 2; }
        
        .thrust-particles {
            position: absolute; bottom: 15px; left: 50%;
            transform: translateX(-50%) rotate(45deg); z-index: 1;
        }
        .particle {
            position: absolute; width: 10px; height: 10px;
            background: linear-gradient(to top, #ff9800, #ff5722);
            border-radius: 50%; opacity: 0;
            animation: thrust 0.8s infinite ease-out;
        }
        @keyframes thrust {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .flag {
            position: absolute; bottom: 80px; left: 50%;
            font-size: 2rem; opacity: 0; transform: translateX(-50%) scale(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flag.planted { opacity: 1; transform: translateX(-50%) scale(1); }

        /* --- TEXTOS --- */
        h1 { font-size: 2.5rem; margin: 0 0 20px 0; background: linear-gradient(135deg, #fff 20%, var(--neon-pink) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
        p { color: #e2e8f0; font-size: 1.1rem; line-height: 1.7; margin-bottom: 3rem; font-weight: 300; }
        
        /* --- BARRA DE PROGRESO REAL --- */
        .progress-box { 
            position: relative; width: 100%; height: 10px; 
            background: rgba(255, 255, 255, 0.08); border-radius: 20px; 
            overflow: hidden; margin-bottom: 12px; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); 
        }
        .progress-fill { 
            height: 100%; width: 0%; /* Empieza en 0, JS lo actualiza */
            border-radius: 20px; 
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink), var(--neon-blue), var(--neon-purple)); 
            background-size: 300% 100%; 
            animation: gradientFlow 3s linear infinite; 
            box-shadow: 0 0 20px var(--neon-purple); 
            position: relative; 
            transition: width 1s ease-out; /* Transición suave al cargar */
        }
        .progress-fill::after { 
            content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 40%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); 
            transform: translateX(-150%) skewX(-20deg); 
            animation: shimmerFlow 2s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes gradientFlow { 0% { background-position: 100% 0; } 100% { background-position: -200% 0; } }
        @keyframes shimmerFlow { 100% { transform: translateX(250%) skewX(-20deg); } }
        
        .progress-label { 
            font-size: 0.9rem; color: var(--neon-pink); font-weight: 600; letter-spacing: 1px; 
            display: flex; justify-content: space-between; 
            text-shadow: 0 0 10px rgba(255, 94, 161, 0.5); 
        }
        
        .footer { margin-top: 4rem; font-size: 0.85rem; color: rgba(255,255,255,0.4); font-weight: 500; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="moon" id="moon">
        <div class="crater" style="width: 30px; height: 30px; top: 20%; left: 20%;"></div>
        <div class="crater" style="width: 15px; height: 15px; top: 60%; left: 50%;"></div>
        <div class="crater" style="width: 20px; height: 20px; top: 30%; right: 20%;"></div>
    </div>

    <div class="rocket-container" id="rocket">
        <div class="flag" id="flag">🚩</div>
        <div class="rocket-body">🚀</div>
        <div class="thrust-particles" id="thrust"></div>
    </div>

    <div class="maintenance-card">
        <h1>Estamos agregando mejoras importantes</h1>
        <p>El <strong>Curso ECOEMS</strong> se está actualizando para ser más rápido y seguro. Pronto volveremos.</p>
        
        <div class="progress-box">
            <div class="progress-fill" id="realProgressBar"></div>
        </div>
        <div class="progress-label">
            <span>Progreso General</span>
            <span id="percentageText">0%</span>
        </div>
        
        <div class="footer">© <span id="year"></span> Curso ECOEMS CCSMX</div>
    </div>

    <script>
        gsap.registerPlugin(MotionPathPlugin);

        // --- CONFIGURACIÓN DE FECHA Y TIEMPO (13 DÍAS) ---
        // ⚠️ FECHA DE INICIO: 1 DE ENERO DE 2026 (Ajusta si quieres reiniciar la cuenta)
        const START_DATE = new Date('2026-01-01T00:00:00'); 
        const TOTAL_DAYS = 13;

        function updateRealProgress() {
            const now = new Date();
            const endDate = new Date(START_DATE.getTime() + (TOTAL_DAYS * 24 * 60 * 60 * 1000));
            
            let percentage = 0;

            if (now >= endDate) {
                percentage = 100;
            } else if (now > START_DATE) {
                const totalDuration = endDate - START_DATE;
                const timePassed = now - START_DATE;
                percentage = (timePassed / totalDuration) * 100;
            }

            // Actualizar la barra y el texto con 2 decimales para que se vea "vivo"
            const finalPercent = percentage.toFixed(4); 
            document.getElementById('realProgressBar').style.width = finalPercent + '%';
            document.getElementById('percentageText').innerText = parseFloat(finalPercent).toFixed(1) + '%';
        }

        // Actualizar la barra cada segundo
        setInterval(updateRealProgress, 1000);
        updateRealProgress(); // Ejecutar inmediatamente al cargar

        // --- ESTRELLAS Y AÑO ---
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div'); star.className = 'star';
            const size = Math.random() * 2.5 + 0.5; star.style.width = size + 'px'; star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's');
            star.style.animationDelay = (Math.random() * 4) + 's';
            starsContainer.appendChild(star);
        }
        document.getElementById('year').textContent = new Date().getFullYear();

        // --- FUEGO DEL COHETE ---
        const thrustContainer = document.getElementById('thrust');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div'); p.className = 'particle';
            p.style.setProperty('--tx', (Math.random() * 40 - 20) + 'px');
            p.style.setProperty('--ty', (Math.random() * 100 + 50) + 'px');
            p.style.animationDelay = (Math.random() * 0.8) + 's';
            thrustContainer.appendChild(p);
        }

        // --- MISIÓN ESPACIAL CON ATERRIZAJE ---
        const rocket = document.getElementById('rocket');
        const flag = document.getElementById('flag');
        const moon = document.getElementById('moon');

        function getMoonPosition() {
            const rect = moon.getBoundingClientRect();
            return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        }

        function randomPath(landing = false) {
            const width = window.innerWidth; const height = window.innerHeight;
            const startX = Math.random() < 0.5 ? -100 : width + 100;
            const startY = height + 100;
            const endX = Math.random() < 0.5 ? -100 : width + 100;
            const endY = -100;

            const path = [{ x: startX, y: startY }];
            for (let i = 0; i < 3; i++) {
                path.push({
                    x: Math.random() * width * 1.5 - width * 0.25,
                    y: Math.random() * height * 0.8 + height * 0.1
                });
            }
            if (landing) {
                const moonPos = getMoonPosition();
                path.push({ x: moonPos.x - 40, y: moonPos.y - 60 });
            } else {
                path.push({ x: endX, y: endY });
            }
            return path;
        }

        function launchMission() {
            const isLandingMission = Math.random() > 0.5; 
            const path = randomPath(isLandingMission);
            const duration = isLandingMission ? 8 : 12;

            gsap.set(flag, { opacity: 0, scale: 0 });
            gsap.set(thrustContainer, { opacity: 1 });

            const tl = gsap.timeline({
                onComplete: () => {
                    if (!isLandingMission) launchMission();
                }
            });

            tl.to(rocket, {
                duration: duration,
                motionPath: { path: path, curviness: 1.5, autoRotate: true },
                ease: isLandingMission ? "power2.out" : "none"
            });

            if (isLandingMission) {
                tl.to(rocket, { rotation: 0, duration: 1 }, "-=1");
                tl.to(thrustContainer, { opacity: 0, duration: 0.5 }, "-=0.5");
                tl.to(flag, { opacity: 1, scale: 1, duration: 0.5 });
                tl.to({}, { duration: 3 });
                tl.to(flag, { opacity: 0, scale: 0, duration: 0.3 });
                tl.to(thrustContainer, { opacity: 1, duration: 0.3 });
                tl.to(rocket, { 
                    y: -200, x: "+=100", rotation: 45, duration: 2, ease: "power3.in",
                    onComplete: launchMission 
                });
            }
        }

        setTimeout(launchMission, 1000);
        window.addEventListener('resize', () => gsap.killTweensOf(rocket) && launchMission());

    </script>
</body>
</html>
