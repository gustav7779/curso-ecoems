<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Credenciales | Curso ECOEMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Colores Corporativos */
            --brand-primary: #2563eb;
            --brand-dark: #1e3a8a;
            --brand-gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            
            /* Colores UI */
            --bg-page: #eef2f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --field-bg: #f3f4f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page);
            margin: 0;
            padding: 40px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* --- CONTROLES (NO IMPRIMIR) --- */
        .no-print {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border: 1px solid #e5e7eb;
        }
        .btn-print {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex; gap: 8px; align-items: center;
            transition: 0.2s;
        }
        .btn-print:hover { background: #000; }

        /* --- GRID --- */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px; /* Más espacio entre tarjetas */
            max-width: 24cm;
            margin: 0 auto;
        }

        /* --- TARJETA V3 (CORREGIDA) --- */
        .id-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            height: 250px; /* Altura fija segura */
            display: flex;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;
            page-break-inside: avoid;
        }

        /* LADO IZQUIERDO (Visual) */
        .card-left {
            width: 35%;
            background: var(--brand-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            z-index: 1;
        }
        /* Patrón sutil */
        .card-left::after {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .logo-icon { font-size: 3rem; margin-bottom: 10px; }
        .logo-text { font-size: 1rem; font-weight: 800; text-align: center; line-height: 1.2; letter-spacing: 1px; }

        /* LADO DERECHO (Datos) */
        .card-right {
            width: 65%;
            padding: 25px 30px; /* Padding generoso para evitar cortes */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* TÍTULO Y NOMBRE */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
        }
        
        .student-label {
            font-size: 0.75rem;
            color: var(--brand-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .student-name {
            font-size: 1.4rem; /* Texto grande */
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2; /* Importante para que no se corte */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        /* CAMPOS DE DATOS */
        .credentials-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-row {
            display: flex;
            flex-direction: column;
        }

        .field-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 5px;
        }

        .field-box {
            background: var(--field-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace; /* Fuente monoespaciada para claves */
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            border: 1px solid transparent;
        }

        /* Resaltar la contraseña */
        .pass-box {
            background: #eff6ff; /* Azul muy claro */
            color: var(--brand-primary);
            border-color: #dbeafe;
        }

        .manual-text {
            color: #9ca3af;
            font-weight: normal;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            font-style: italic;
        }

        /* IMPRESIÓN */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .cards-grid { gap: 15px; width: 100%; margin: 0; }
            .id-card { border: 1px solid #ddd; break-inside: avoid; box-shadow: none; }
            .field-box, .card-left { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <div style="display:flex; align-items:center; gap:15px;">
            <a href="{{ url_for('manage_users') }}" style="color:var(--text-muted); text-decoration:none;">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 style="margin:0; font-size:1.2rem; color:var(--text-main);">Imprimir Credenciales</h2>
        </div>
        <button onclick="window.print()" class="btn-print">
            <i class="fas fa-print"></i> Imprimir PDF
        </button>
    </div>

    <div class="cards-grid">
        {% for student in students %}
        <div class="id-card">
            
            <div class="card-left">
                <i class="fas fa-user-graduate logo-icon"></i>
                <div class="logo-text">CURSO<br>ECOEMS</div>
            </div>
            
            <div class="card-right">
                
                <div class="header-row">
                    <div>
                        <div class="student-label">Alumno Oficial</div>
                        <div class="student-name" title="{{ student.username }}">
                            {{ student.username }}
                        </div>
                    </div>
                    <i class="fas fa-check-circle" style="color:var(--brand-primary); font-size:1.2rem; opacity:0.2;"></i>
                </div>

                <div class="credentials-group">
                    
                    <div class="field-row">
                        <span class="field-label"><i class="fas fa-id-card"></i> Usuario</span>
                        <div class="field-box">
                            {{ student.username }}
                        </div>
                    </div>

                    <div class="field-row">
                        <span class="field-label"><i class="fas fa-key"></i> Contraseña</span>
                        
                        {% if student.visible_password %}
                            <div class="field-box pass-box">
                                {{ student.visible_password }}
                            </div>
                        {% else %}
                            <div class="field-box" style="background:white; border:1px dashed #ccc; padding:6px 10px;">
                                <span class="manual-text">__________________</span>
                            </div>
                        {% endif %}
                    </div>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
